<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fcf9ec">
<title>Consumed</title>
<meta name="description" content="One daily page of what you listened to, read and ate. Logged in seconds, as stickers your friends can react to today.">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800;900&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app" data-view="today">
  <header class="top">
    <button class="round small" id="menu-btn" aria-label="Your profile and settings"><span class="av" id="me-av">S</span></button>
    <nav class="pillnav" aria-label="Pages">
      <button data-go="today" aria-current="page">Today</button>
      <button data-go="friends">Friends</button>
      <button data-go="tonight">Tonight</button>
    </nav>
    <button class="round small" id="sound-btn" aria-label="Sound on" aria-pressed="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path class="on" d="M15.5 9.5a3.5 3.5 0 0 1 0 5M18 7a7 7 0 0 1 0 10"/><path class="off" d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
    </button>
  </header>

  <main class="views" id="views">
    <section class="view" id="v-today" aria-label="Today">
      <div class="head">
        <div class="title-row"><h1>Today</h1><button class="tidy" id="tidy" hidden>Tidy Up</button></div>
        <div class="date"><span id="today-date"></span></div>
        <div class="tally" id="tally"></div>
      </div>
      <div class="page" id="page">
        <div class="sheet" id="board" aria-label="Today's stickers. Drag one to move it, twist with two fingers to turn it."></div>
      </div>
      <div class="under">
        <div class="pillcard" id="chain"></div>
        <div class="pillcard dare" id="dare"></div>
      </div>
      <div class="dock">
        <button class="logbtn" id="log-btn">Log Something <span class="plus" aria-hidden="true">+</span></button>
        <button class="round" data-go="friends" aria-label="Friends">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><circle cx="17.5" cy="9" r="2.5"/><path d="M17 14.6c2.6.2 4.2 1.9 4.6 4.6"/></svg>
        </button>
      </div>
    </section>

    <section class="view" id="v-friends" aria-label="Friends">
      <div class="head"><h1>Friends</h1><div class="date"><span>Today, one feed</span><span class="count" id="friends-count"></span></div></div>
      <div class="feed" id="feed"></div>
    </section>

    <section class="view night" id="v-tonight" aria-label="Tonight">
      <div class="reveal" id="reveal">
        <p class="hint" id="tonight-hint">Your day is sealed inside</p>
        <div class="capsule-stage" id="stage">
          <svg class="shell top-shell" viewBox="0 0 250 124" aria-hidden="true"><path d="M8 122 C 8 40, 70 4, 125 4 S 242 40, 242 122 L 205 106 L 175 122 L 140 102 L 110 122 L 78 102 L 45 122 Z" fill="#f6b52a"/><path d="M44 68 C 64 30, 120 16, 168 24" stroke="#fff3c4" stroke-width="10" fill="none" stroke-linecap="round" opacity=".7"/></svg>
          <svg class="shell bot-shell" viewBox="0 0 250 124" aria-hidden="true"><path d="M8 2 L 45 18 L 78 2 L 110 22 L 140 2 L 175 22 L 205 2 L 242 18 C 242 82, 190 120, 125 120 S 8 82, 8 2 Z" fill="#e8432e"/><path d="M40 50 C 56 84, 92 100, 124 102" stroke="#fff" stroke-opacity=".25" stroke-width="9" fill="none" stroke-linecap="round"/></svg>
          <img class="card" id="card-img" alt="Your Consumed card for today">
        </div>
        <div class="actions" id="actions">
          <button class="crack" id="crack-btn">Crack It Open</button>
        </div>
        <div class="share" id="share" hidden>
          <button class="a" id="share-stories">Share to Stories</button>
          <button class="b" id="share-wa">Send on WhatsApp</button>
          <button class="c" id="save-card">Save Image</button>
        </div>
      </div>
    </section>
  </main>
</div>

<!-- Log something -->
<div class="logsheet" id="log" role="dialog" aria-modal="true" aria-labelledby="log-title" hidden>
  <div class="log-top">
    <button class="round small" id="log-close" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
    <h2 id="log-title">Log Something</h2>
    <span class="muse-badge" id="muse-badge"></span>
  </div>
  <div class="seg" role="tablist" aria-label="What did you consume?">
    <button role="tab" data-cat="audio" aria-selected="true">Audio</button>
    <button role="tab" data-cat="book" aria-selected="false">Books</button>
    <button role="tab" data-cat="food" aria-selected="false">Food</button>
  </div>
  <label class="viewfinder" id="vf">
    <input type="file" id="photo" accept="image/*" hidden>
    <img id="vf-img" alt="" hidden>
    <span class="vf-empty" id="vf-empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.6"/></svg>
      <b>Snap or Upload a Photo</b>
      <span id="vf-sub">An album, a book cover or your plate</span>
    </span>
    <span class="scan" id="scan" hidden><i></i><b id="scan-text">Muse Spark is looking</b></span>
  </label>
  <form class="search" id="search">
    <input id="q" type="search" autocomplete="off" enterkeyhint="search" placeholder="Search a song or audiobook">
    <button type="submit" aria-label="Find it"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
  </form>
  <div class="chips" id="chips"></div>
  <p class="log-err" id="log-err" role="alert" hidden></p>

  <div class="result" id="result" hidden>
    <div class="grab"></div>
    <div class="res-row">
      <div class="res-art" id="res-art"></div>
      <div class="res-text">
        <div class="eyebrow" id="res-eyebrow"><i></i>Muse Spark sees</div>
        <h3 id="res-title"></h3>
        <div class="meta" id="res-meta"></div>
        <div class="credit" id="res-credit"></div>
      </div>
    </div>
    <div class="note" id="res-note"></div>
    <label class="finish" id="finish" hidden>
      <span>I finished it</span>
      <span class="toggle"><input type="checkbox" id="finished" role="switch"><i></i></span>
    </label>
    <div class="res-actions">
      <button class="ghost" id="res-again">Not It</button>
      <button class="stick" id="stick">Stick It</button>
    </div>
  </div>
</div>

<!-- A sticker, up close -->
<div class="scrim" id="detail" hidden>
  <div class="detail" role="dialog" aria-modal="true" aria-labelledby="d-title">
    <div class="grab"></div>
    <div class="d-art" id="d-art"></div>
    <h3 id="d-title"></h3>
    <div class="meta" id="d-meta"></div>
    <div class="credit" id="d-credit"></div>
    <div class="note" id="d-note"></div>
    <div class="flick">
      <span>Flick to a Friend</span>
      <div class="avs" id="d-friends"></div>
    </div>
    <div class="d-actions">
      <button class="ghost" id="d-remove">Remove</button>
      <button class="stick" id="d-done">Done</button>
    </div>
  </div>
</div>

<!-- Profile and settings -->
<div class="scrim" id="menu" hidden>
  <div class="menu" role="dialog" aria-modal="true" aria-label="Settings">
    <div class="grab"></div>
    <div class="me"><span class="av big">S</span><div><b>Sam</b><span id="me-days"></span></div></div>
    <label class="row"><span>Sounds</span><span class="toggle"><input type="checkbox" id="sound-toggle" role="switch" checked><i></i></span></label>
    <div class="row"><span>Muse</span><span class="status" id="muse-status">Checking</span></div>
    <p class="fine" id="muse-reason"></p>
    <button class="ghost wide" id="fresh">Start Fresh</button>
    <p class="fine">Your log stays in this browser. Friends here are sample friends.</p>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script type="module" src="app.js"></script>
</body>
</html>
